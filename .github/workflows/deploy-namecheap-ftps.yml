name: Deploy News Reader homepage by secure FTPS
on:
  workflow_dispatch:
  push:
    paths:
      - 'deployment/namecheap/index.html'
      - '.github/workflows/deploy-namecheap-ftps.yml'
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # User updated FTPS remote directory; rerun secure deployment acceptance test.
      - name: Verify secure FTPS configuration
        env:
          FTPS_HOST: server238.web-hosting.com
          FTPS_USERNAME: ${{ secrets.FTPS_USERNAME }}
          FTPS_PASSWORD: ${{ secrets.FTPS_PASSWORD }}
          FTPS_REMOTE_DIR: ${{ vars.FTPS_REMOTE_DIR || '/' }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in FTPS_HOST FTPS_USERNAME FTPS_PASSWORD FTPS_REMOTE_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing FTPS configuration::Set $name in GitHub Actions secrets or variables as documented."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          # Host must be a hostname, never a URL or a credential-bearing string.
          if [[ ! "$FTPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then echo "Invalid FTPS host"; exit 1; fi
          if [[ "$FTPS_REMOTE_DIR" == *'..'* ]] || [[ "$FTPS_REMOTE_DIR" == *'?'* ]] || [[ "$FTPS_REMOTE_DIR" == *'#'* ]]; then
            echo "Invalid remote directory"; exit 1
          fi
          remote="${FTPS_REMOTE_DIR#/}"
          remote="${remote%/}"
          # Diagnose public TLS certificate identity without exposing credentials.\n          echo "FTPS server certificate (public identity):"\n          timeout 12 openssl s_client -starttls ftp -connect "$FTPS_HOST:21" -servername "$FTPS_HOST" </dev/null 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName || true\n          # Explicit TLS is required; never permit silent downgrade to insecure FTP.
          curl --fail --silent --show-error --max-time 100 --ssl-reqd \
            --user "$FTPS_USERNAME:$FTPS_PASSWORD" \
            --upload-file deployment/namecheap/index.html \
            "ftp://$FTPS_HOST/$remote/index.html"
          echo "FTPS homepage upload completed."
      - name: Verify published HTTPS homepage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 \
            --header 'Cache-Control: no-cache' \
            'https://news.palmerfamily.org/?deploy_check='${GITHUB_RUN_ID} -o homepage-live.html
          grep -q 'id="theme-toggle"' homepage-live.html || { echo "::error::Live homepage lacks the light/dark switch"; exit 1; }
          grep -q 'id="verification-status"' homepage-live.html || { echo "::error::Live homepage lacks verification status"; exit 1; }
          grep -q 'id="task-briefings"' homepage-live.html || { echo "::error::Missing full scheduled task reports section"; exit 1; }
          grep -q 'showTaskBrief' homepage-live.html || { echo "::error::Missing scheduled task JSON report renderer"; exit 1; }
          grep -q 'id="full-briefings"' homepage-live.html || { echo "::error::Missing morning/evening analysis"; exit 1; }
          grep -q 'loadFullBriefings()' homepage-live.html || { echo "::error::Report archive reader missing"; exit 1; }
          [ "$(grep -o 'id="theme-toggle"' homepage-live.html | wc -l)" -eq 1 ] || { echo "::error::Duplicate theme switch"; exit 1; }
          python -c "import re; t=open('homepage-live.html').read(); open('/tmp/newsreader-live.js','w').write('\\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',t,re.S|re.I)))"
          node --check /tmp/newsreader-live.js
          curl --fail --silent --show-error --max-time 30 \
            'https://mobilelew.github.io/NewsFeed/reports/latest/morning.json' -o morning-live.json
          python -c "import json; d=json.load(open('morning-live.json')); assert d.get('executive_summary'); assert d.get('report_date')=='2026-10-17'; assert all(h.get('verification')=='Unverified' for h in d['headlines']); print('Live GitHub Pages morning analysis available; all five items labelled Unverified.')"
          echo "Public homepage analysis controls and JavaScript verified."

