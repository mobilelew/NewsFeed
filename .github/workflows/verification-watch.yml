name: Hourly original-source verification checks
on:
  schedule:
    - cron: '28 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news-reader-verification
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Confirm source figures against official index text, without treating matching numbers as full verification.
      - run: python -m unittest -v test_verification_watch.py test_official_authority_lookup.py test_source_capture.py
      - name: Recheck competent original source documents
        run: python verification_watch.py
      - name: Publish verification status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update independent source recheck status"
          for n in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
