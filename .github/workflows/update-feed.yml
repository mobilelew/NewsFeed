
name: Update News Reader feed

on:
  schedule:
    - cron: '18 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-reader-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update feed and push safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt"

            git fetch origin main
            git checkout main
            git reset --hard origin/main

            python build_feed.py
            python service_health.py
            python acceptance_check.py
            git add feed.json service-health.json acceptance-status.json

            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi

            git commit -m "Update widget feed"

            if git push origin HEAD:main; then
              echo "Feed updated successfully."
              exit 0
            fi

            echo "Remote changed; retrying from latest main."
            sleep 3
          done

          echo "Unable to push after five attempts."
          exit 1
